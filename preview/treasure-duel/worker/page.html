async function act(action,fields={}){if(busy)return null;busy=true;alertText='';document.querySelectorAll('[data-mutation]').forEach(b=>b.disabled=true);const body={action,actor,...fields,key:crypto.randomUUID()};try{let response;try{response=await fetch('/api/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});}catch{response=await fetch('/api/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});}const data=await response.json();if(!response.ok)throw new Error(data.error||'Please try again.');state=data;lastSync=Date.now();fingerprint='';online=true;render();toast(data.message);return data;}catch(e){alertText=e.message;toast(e.message,true);return null;}finally{busy=false;if(state)render();if(dialog)renderDialog();}}
function render(){const p=me();if(!state.players.some(p=>p.id===actor)){actor='jiet';sync(true);return;}const activeGames=state.challenges.filter(active);const history=state.challenges.filter(c=>!active(c));app.innerHTML=`
<header class="top"><div class="top-inner"><div class="brand"><span class="brand-mark">☘</span><div><strong>Clover Cove</strong><small>THE IRELAND ADVENTURE</small></div><span class="test-badge">PRIVATE PREVIEW</span></div><div class="top-right"><div class="identity"><label for="captain">Test as captain</label><select id="captain" aria-label="Switch demo captain">${state.players.map(p=>'<option value="'+p.id+'" '+(p.id===actor?'selected':'')+'>'+p.emoji+' '+p.name+'</option>').join('')}</select></div></div></div></header>
<div class="wrap"><div class="sandbox-note"><i class="live-dot"></i><span>TEST WATERS · Demo gold only. Your trip’s gold is safe. Switch captains to try both sides.</span></div>
<section class="hero"><div><div class="caps">A little strategy. A little rivalry.</div><h1>Outsmart the crew.<br><em>Claim the treasure.</em></h1><p>Five islands. Twelve cannonballs. One secret plan.<br>Challenge a captain and make every shot count.</p></div><div class="hero-actions"><button class="btn primary" data-open="invite">⚔ &nbsp; Challenge a captain</button><button class="btn ghost" data-open="help">How does it work? ↗</button></div></section>
<div class="layout"><main class="main-column"><section class="panel fleet"><div class="section-head"><h2>Your battlefield</h2><span class="round-badge">5 islands · 15 points</span></div><div class="map">${state.islands.map((i,n)=>'<div class="island"><div class="island-art"><span class="island-icon">'+i.icon+'</span><span class="point-tag">'+i.points+' '+(i.points===1?'point':'points')+'</span></div><div class="island-name">'+i.name+'</div><div class="round-number">ROUND '+(n+1)+'</div></div>').join('')}</div><div class="map-legend"><span>● 12 cannonballs for the whole duel</span><span>0–5 per island · Highest treasure score wins</span></div></section>
<section class="challenge-section"><div class="section-head"><h2>Your challenges</h2><button class="btn primary small" data-open="invite">＋ Invite</button></div><div class="tabs" role="tablist" aria-label="Challenge lists"><button class="tab ${tab==='active'?'active':''}" role="tab" aria-selected="${tab==='active'}" data-tab="active">In play <span class="count">${activeGames.length}</span></button><button class="tab ${tab==='history'?'active':''}" role="tab" aria-selected="${tab==='history'}" data-tab="history">Battle log <span class="count">${history.length}</span></button></div><div id="challenge-list">${(tab==='active'?activeGames:history).map(challengeCard).join('')||'<div class="panel empty"><div class="empty-icon">'+(tab==='active'?'⚓':'📜')+'</div><strong>'+(tab==='active'?'A friendly rivalry starts here.':'Your story is still unwritten.')+'</strong><p>'+(tab==='active'?'Invite someone from the crew, or try a free practice duel first. Neither captain has to stay online.':'Completed battles and returned invitations will appear here.')+'</p>'+(tab==='active'?'<button class="btn outline small" data-open="invite">Choose your opponent →</button>':'')+'</div>'}</div></section>
<div class="practice-card"><div class="practice-icon">🧭</div><div><h3>Find your sea legs.</h3><p>A free duel against Captain Bot. No gold, no daily limit.</p></div><button class="btn outline small" id="practice" data-mutation>Try practice →</button></div></main>
<aside class="side-column"><section class="panel wallet"><div class="wallet-title caps">${esc(p.name)}’s treasure</div><div class="wallet-gold"><span>🪙</span>${fmt(p.available)}</div><div class="wallet-row"><span>Available to challenge</span><strong>${fmt(p.available)}</strong></div><div class="wallet-row"><span>Reserved in challenges</span><strong>${fmt(p.reserved)}</strong></div><div class="wallet-limits"><div class="limit-row"><span>Your daily attack</span><strong>${p.sentToday} / 1</strong></div><div class="limit-dots">${[0].map(i=>'<span class="'+(i<p.sentToday?'on':'')+'"></span>').join('')}</div><div class="limit-row"><span>Incoming accepted today</span><strong>${p.receivedToday} · unlimited</strong></div><div class="stats-note" style="color:#cbdac6">Your attack allowance stays yours.</div></div></section>
<section class="panel crew"><div class="section-head"><h2>The crew</h2><span class="caps muted" style="font-size:9px">Demo gold</span></div><div class="crew-list">${[...state.players].sort((a,b)=>b.total-a.total).map((p,n)=>'<div class="crew-row"><span class="crew-rank">'+(n+1)+'</span>'+avatar(p)+'<div class="crew-name">'+esc(p.name)+(p.id===actor?' <small>You · '+p.wins+' duel wins</small>':'<small>'+p.wins+' duel wins</small>')+'</div><span class="crew-gold">'+fmt(p.total)+'</span></div>').join('')}</div></section>
<section class="panel help-card"><h3>A duel in three steps</h3><div class="help-step"><span class="step-number">1</span><span><strong>Invite.</strong> Both captains match the gold stake.</span></div><div class="help-step"><span class="step-number">2</span><span><strong>Arrange.</strong> Secretly spread 12 cannonballs across the islands.</span></div><div class="help-step"><span class="step-number">3</span><span><strong>Reveal.</strong> More cannonballs takes that island’s points.</span></div><button class="text-btn" data-open="help">All rules & preview controls</button></section></aside></div>
<footer class="footer"><span>CLOVER COVE · TREASURE DUEL<br>Private sandbox · Separate from the live trip app</span><span class="connection"><i class="live-dot"></i><span id="connection">${online?'Shared demo · Synced':'Reconnecting…'}</span></span></footer></div>`;
$('#captain').onchange=e=>switchCaptain(e.target.value);app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDialog(b.dataset.open));app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});app.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openChallenge(b.dataset.view));app.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{const r=await act('accept',{id:b.dataset.accept});if(r)openChallenge(b.dataset.accept);});app.querySelectorAll('[data-decline]').forEach(b=>b.onclick=()=>act('decline',{id:b.dataset.decline}));app.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>act('cancel',{id:b.dataset.cancel}));app.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>switchCaptain(b.dataset.switch));$('#practice').onclick=async()=>{const existing=state.challenges.find(c=>c.practice&&active(c));if(existing)return openChallenge(existing.id);const r=await act('practice');if(r)openChallenge(r.challengeId);};}
function challengeCard(c){const p=other(c);let label='',action='',status='';if(c.status==='pending'){label=mine(c)?'You challenged '+p.name:p.name+' challenged you';status=mine(c)?'Waiting for acceptance':'Invitation for you';action=mine(c)?'<button class="btn ghost small" data-cancel="'+c.id+'" data-mutation>Cancel</button><button class="btn outline small" data-switch="'+c.to+'">Test as '+esc(p.name)+' →</button>':'<button class="btn ghost small" data-decline="'+c.id+'" data-mutation>Decline</button><button class="btn primary small" data-accept="'+c.id+'" data-mutation>Accept</button>';}else if(c.status==='accepted'){label='You vs '+p.name;status=c.ready[actor]?'Your plan is locked':'Arrange your plan';action='<button class="btn '+(c.ready[actor]?'outline':'primary')+' small" data-view="'+c.id+'">'+(c.ready[actor]?'View duel':'Arrange →')+'</button>';}else if(c.status==='complete'){const won=c.result.winner&&(c.result.winner==='a'?c.from:c.to)===actor;label='You vs '+p.name;status=c.result.winner?(won?'Victory':'Defeat'):'Draw · stakes returned';action='<button class="btn outline small" data-view="'+c.id+'">Watch reveal ↗</button>';}else{label='You & '+p.name;status=c.status[0].toUpperCase()+c.status.slice(1)+' · gold returned';}return '<article class="panel challenge-card">'+avatar(p)+'<div class="challenge-info"><strong>'+esc(label)+'<span class="pill '+(c.status==='complete'||c.status==='accepted'?'ready':'')+'">'+esc(status)+'</span></strong><small>'+(c.practice?'Free practice':fmt(c.stake)+' gold each · '+fmt(c.stake*2)+' gold pot')+(active(c)?' · '+timeLeft(c)+' left':'')+'</small></div><div class="challenge-actions">'+action+'</div></article>';}
async function switchCaptain(id){if(busy)return;actor=id;localStorage.setItem('duel.preview.captain',id);closeDialog();state=null;fingerprint='';await sync(true);toast('You are testing as '+person(id).name+'.');}
function closeDialog(){if(busy)return;dialog=null;selected=null;modal.close();}
function openDialog(kind){dialog=kind;alertText='';if(kind==='invite'){selected=state.players.find(p=>p.id!==actor)?.id;stakePct=10;customStake='';}renderDialog();if(!modal.open)modal.showModal();}
function openChallenge(id){selected=id;dialog='duel';reveal=0;alertText='';const c=state.challenges.find(x=>x.id===id);try{draft=c?.myPlan?[...c.myPlan]:JSON.parse(localStorage.getItem('duel.plan.'+id+'.'+actor)||'[0,0,0,0,0]');if(!Array.isArray(draft)||draft.length!==5||draft.some(x=>!Number.isInteger(x)||x<0||x>5)||draft.reduce((a,b)=>a+b,0)>12)draft=[0,0,0,0,0];}catch{draft=[0,0,0,0,0];}renderDialog();if(!modal.open)modal.showModal();}
function frame(title,content){modal.innerHTML='<div class="dialog-head"><h2 id="modal-title">'+title+'</h2><button class="close" aria-label="Close dialog">×</button></div><div class="dialog-body">'+(alertText?'<div class="dialog-alert" role="alert">'+esc(alertText)+'</div>':'')+content+'</div>';modal.querySelector('.close').onclick=closeDialog;}
function renderDialog(){if(!dialog||!state)return;if(dialog==='invite')return renderInvite();if(dialog==='help')return renderHelp();if(dialog==='reset'){frame('Reset the demo?', '<p class="dialog-intro">This clears every sandbox challenge and gives all seven captains 1,000 demo gold. It affects this shared preview on all your devices.</p><div class="dialog-foot"><button class="btn outline" id="keep-demo">Keep playing</button><button class="btn danger" id="reset-demo" data-mutation>Reset demo</button></div>');$('#keep-demo').onclick=closeDialog;$('#reset-demo').onclick=async()=>{const r=await act('reset',{confirm:'RESET DEMO'});if(r){tab='active';dialog=null;modal.close();render();}};return;}
const c=state.challenges.find(x=>x.id===selected);if(!c){frame('Duel unavailable','<p class="dialog-intro">This demo was reset on another device.</p>');return;}if(c.status==='complete')return renderReveal(c);if(c.status!=='accepted'){frame('Challenge '+esc(c.status),'<p class="dialog-intro">'+(c.status==='pending'?'Waiting for '+esc(person(c.to).name)+' to accept. You can switch captains in the preview to test their side.':'This invitation has ended. Reserved demo gold has been returned.')+'</p>');return;}if(c.ready[actor])return renderWaiting(c);renderPlan(c);}
function renderInvite(){const opponent=person(selected),smaller=Math.min(me().available,opponent.available),max=Math.floor(smaller*.2/10)*10;const amount=customStake!==''?Number(customStake):Math.floor(smaller*stakePct/100/10)*10;const duplicate=state.challenges.some(c=>!c.practice&&active(c)&&[c.from,c.to].includes(selected));const allowed=Number.isInteger(amount)&&amount>=10&&amount%10===0&&amount<=max&&me().activeOutgoing<1&&me().sentToday<1&&!duplicate;frame('Challenge a captain',`<p class="dialog-intro">A friendly wager in demo gold. Both captains contribute the same amount, and can play at different times.</p><span class="field-label">Who’s your rival?</span><div class="captain-grid">${state.players.filter(p=>p.id!==actor).map(p=>'<button class="captain-choice '+(p.id===selected?'selected':'')+'" data-captain="'+p.id+'" aria-pressed="'+(p.id===selected)+'">'+avatar(p)+'<span>'+esc(p.name)+'<small>'+fmt(p.available)+' available</small></span></button>').join('')}</div><span class="field-label">How much gold each?</span><div class="stake-grid">${[5,10,20].map((pct,n)=>'<button class="stake-choice '+(customStake===''&&stakePct===pct?'selected':'')+'" data-pct="'+pct+'" aria-pressed="'+(customStake===''&&stakePct===pct)+'">'+['Casual','Competitive','High stakes'][n]+'<strong>🪙 '+fmt(Math.floor(smaller*pct/100/10)*10)+'</strong><small>'+pct+'% of smaller balance</small></button>').join('')}</div><label class="custom-field" for="custom-stake"><span>Or choose an amount · max '+fmt(max)+'</span><input id="custom-stake" type="number" inputmode="numeric" min="10" max="${max}" step="10" placeholder="Custom gold" value="${esc(customStake)}"></label><div class="receipt"><div><span style="font-size:12px">Winner’s treasure</span><small>You contribute ${fmt(amount||0)} · ${esc(opponent.name)} contributes ${fmt(amount||0)}</small></div><strong>🪙 ${fmt((amount||0)*2)}</strong></div>${duplicate?'<div class="dialog-alert">You already have a challenge with this captain.</div>':''}${me().sentToday>=1?'<div class="dialog-alert">Your daily attack was accepted already. You can still accept incoming invitations or play free practice.</div>':me().activeOutgoing>=1?'<div class="dialog-alert">Finish your outgoing battle or cancel its unanswered invitation before sending another.</div>':''}<p class="fineprint">Your stake is reserved when you send. Their stake is reserved when they accept. Declined or expired invitations return your gold. One daily attack of your own, plus unlimited incoming acceptances. Incoming battles never use your attack slot.</p><div class="dialog-foot"><button class="btn primary" id="send-invite" data-mutation ${!allowed||busy?'disabled':''}>Send invitation to ${esc(opponent.name)} →</button></div>`);modal.querySelectorAll('[data-captain]').forEach(b=>b.onclick=()=>{selected=b.dataset.captain;customStake='';renderInvite();});modal.querySelectorAll('[data-pct]').forEach(b=>b.onclick=()=>{stakePct=Number(b.dataset.pct);customStake='';renderInvite();});$('#custom-stake').onchange=e=>{customStake=e.target.value;renderInvite();};$('#send-invite').onclick=async()=>{const target=selected;const r=await act('invite',{to:target,stake:amount});if(r){dialog=null;modal.close();}};}
function renderPlan(c){const p=other(c),spent=draft.reduce((a,b)=>a+b,0),left=12-spent;frame('Your secret battle plan',`<p class="dialog-intro">You vs ${esc(p.name)} · ${c.practice?'Free practice':fmt(c.stake)+' gold each'}<br>More cannonballs wins that island’s points. Save your strength for the islands you want most.</p><div class="plan-summary"><div><div class="ammo-count">${left}<small>cannonballs left to arrange</small></div><div class="ammo-pips" aria-label="${spent} of 12 cannonballs arranged">${Array.from({length:12},(_,i)=>'<i class="'+(i<spent?'spent':'')+'"></i>').join('')}</div></div><button class="btn outline small" id="mix-plan">Mix a plan ↻</button></div>${state.islands.map((island,i)=>'<div class="allocation-row"><div class="mini-island" aria-hidden="true">'+island.icon+'</div><div class="allocation-label"><strong>'+island.name+'</strong><small>Round '+(i+1)+' · '+island.points+' '+(island.points===1?'point':'points')+'</small></div><div class="stepper"><button data-minus="'+i+'" aria-label="Use fewer cannonballs on '+island.name+'" '+(draft[i]===0?'disabled':'')+'>−</button><output aria-label="Cannonballs on '+island.name+'">'+draft[i]+'</output><button data-plus="'+i+'" aria-label="Use more cannonballs on '+island.name+'" '+(draft[i]===5||left===0?'disabled':'')+'>+</button></div></div>').join('')}<div class="secrecy"><span>🔒</span><span>Your rival cannot see your plan. Once you lock it, you cannot change it. Both plans reveal only when both are locked.</span></div><div class="dialog-foot"><span class="fineprint" style="margin:0;flex:1">${left===0?'All 12 arranged. Ready, captain?':'Arrange '+left+' more to lock your plan.'}</span><button class="btn primary" id="lock-plan" data-mutation ${left!==0||busy?'disabled':''}>Lock my plan →</button></div>`);function change(i,d){draft[i]+=d;localStorage.setItem('duel.plan.'+c.id+'.'+actor,JSON.stringify(draft));renderPlan(c);}modal.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>change(Number(b.dataset.minus),-1));modal.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>change(Number(b.dataset.plus),1));$('#mix-plan').onclick=()=>{draft=[0,0,0,0,0];for(let i=0;i<12;i++){const choices=draft.map((n,j)=>n<5?j:-1).filter(n=>n>=0);draft[choices[Math.floor(Math.random()*choices.length)]]++;}localStorage.setItem('duel.plan.'+c.id+'.'+actor,JSON.stringify(draft));renderPlan(c);};$('#lock-plan').onclick=async()=>{const r=await act('lock',{id:c.id,plan:[...draft]});if(r){reveal=0;renderDialog();}};}
function renderWaiting(c){const p=other(c);frame('Your plan is locked',`<div class="waiting"><div class="lock-icon">🔒</div><h2>Your move is safe.</h2><p>Waiting for ${esc(p.name)} to lock their plan. You can leave and come back later. The battle resolves when both captains are ready.</p><div class="locked-plan">${c.myPlan.map(n=>'<span>'+n+'</span>').join('')}</div><p>${c.practice?'Captain Bot is preparing…':'For this preview, switch captains to arrange the other side.'}</p>${!c.practice?'<div style="margin-top:20px"><button class="btn primary" id="test-opponent">Test as '+esc(p.name)+' →</button></div>':''}</div>`);if($('#test-opponent'))$('#test-opponent').onclick=()=>switchCaptain(p.id);}
function renderReveal(c){const a=person(c.from),b=person(c.to),r=c.result;let sa=0,sb=0;r.rounds.slice(0,reveal).forEach(x=>{if(x.winner==='a')sa+=x.points;if(x.winner==='b')sb+=x.points;});const won=r.winner&&(r.winner==='a'?c.from:c.to)===actor;const net=r.winner?(won?'+':'−')+fmt(c.stake):'0';frame('The treasure reveal',`<p class="dialog-intro" style="text-align:center;margin-bottom:0">${c.practice?'Free practice · No gold changes':fmt(c.stake*2)+' gold pot · Both plans locked'}</p><div class="reveal-scores"><div class="reveal-player">${avatar(a)}<strong>${esc(a.name)}</strong><div class="score">${sa}</div></div><span class="versus">vs</span><div class="reveal-player">${avatar(b)}<strong>${esc(b.name)}</strong><div class="score">${sb}</div></div></div><div class="reveal-track">${r.rounds.map((x,i)=>{const open=i<reveal,win=x.winner&&(x.winner==='a'?c.from:c.to)===actor;return '<div class="reveal-tile '+(open?'open pulse '+(x.winner?(win?'won':'lost'):''):'')+'"><div class="rt-icon">'+(open?x.icon:'🔒')+'</div><div class="rt-value">'+x.points+' '+(x.points===1?'point':'points')+'</div><div class="rt-choice">'+(open?x.a+' : '+x.b:'? : ?')+'</div><div class="rt-winner">'+(open?(x.winner?esc(x.winner==='a'?a.name:b.name)+' wins':'Tied island'):'Round '+(i+1))+'</div></div>';}).join('')}</div>${reveal===5?'<div class="result-title">'+(r.winner?(won?'🏆 Victory, captain!':'A worthy rival. Rematch?'):'🤝 An honourable draw.')+'</div><p class="result-subtitle">'+(c.practice?'Practice complete. Your gold is unchanged.':r.winner?net+' gold net · The winner received the '+fmt(c.stake*2)+' gold pot.':'Both stakes have been returned in full.')+'</p>':'<div class="result-title">'+(reveal?'On to the next island.':'Two plans. One treasure.')+'</div><p class="result-subtitle">Both allocations are revealed together, island by island.</p>'}<div class="dialog-foot" style="justify-content:center">${reveal<5?'<button class="btn ghost" id="reveal-all">Reveal all</button><button class="btn primary" id="reveal-next">'+(reveal?'Reveal island '+(reveal+1):'Start the reveal')+' →</button>':'<button class="btn primary" id="return-cove">Back to the cove →</button>'}</div>`);if($('#reveal-next'))$('#reveal-next').onclick=()=>{reveal++;renderReveal(c);};if($('#reveal-all'))$('#reveal-all').onclick=()=>{reveal=5;renderReveal(c);};if($('#return-cove'))$('#return-cove').onclick=()=>{tab='history';closeDialog();render();};}
function renderHelp(){frame('A little strategy goes a long way.',`<div class="help-rules"><div class="help-rule"><span class="step-number">1</span><p><strong>Choose a captain and a stake.</strong>5%, 10%, or 20% of the smaller available balance. Custom amounts use the same 20% ceiling. Both players contribute equally.</p></div><div class="help-rule"><span class="step-number">2</span><p><strong>Spread 12 cannonballs across five islands.</strong>Use between 0 and 5 on each island. The islands are worth 1, 2, 3, 4, and 5 points. You can sacrifice one to save ammunition for another.</p></div><div class="help-rule"><span class="step-number">3</span><p><strong>Lock your plan. Your rival locks theirs.</strong>Neither can see the other’s arrangement. You do not have to be online together. Locking is final.</p></div><div class="help-rule"><span class="step-number">4</span><p><strong>Higher allocation takes the island’s points.</strong>A tied island gives no points. The highest total treasure score wins the pot. A drawn match refunds both stakes.</p></div></div><p class="fineprint">Each Dublin day, start one gold attack and accept as many incoming invitations as you wish. Incoming acceptances never use your attack allowance. Keep one outgoing challenge active at a time; incoming games have no count limit. Your outgoing allowance is spent when the other captain accepts; declined or unanswered expired invites let you choose someone else. An accepted match counts even if it later expires. Invitations expire after 24 hours; accepted games get a fresh 24 hours to finish. All uncompleted games refund their reserved stakes on expiry. Practice is free and does not use these limits.</p><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3 style="font-size:13px">Preview controls</h3><p class="fineprint">Use “Test as captain” in the header to try both sides. This private demo has its own shared storage; another signed-in device sees the same matches. Captain switching is for review, not production authentication.</p><div class="tools"><button class="btn outline small" id="demo-reset">Reset demo gold & matches</button>${state.challenges.filter(active).map(c=>'<button class="btn outline small" data-expire="'+c.id+'">Test expiry: '+esc(other(c).name)+'</button>').join('')}</div>`);$('#demo-reset').onclick=()=>{dialog='reset';renderDialog();};modal.querySelectorAll('[data-expire]').forEach(b=>b.onclick=async()=>{const r=await act('expire-demo',{id:b.dataset.expire});if(r){dialog='help';renderHelp();}});}
modal.addEventListener('cancel',e=>{if(busy)e.preventDefault();else{dialog=null;selected=null;}});window.addEventListener('focus',()=>sync());window.addEventListener('online',()=>sync(true));setInterval(()=>{if(!busy&&!document.hidden)sync();},4000);sync(true);
</script>
